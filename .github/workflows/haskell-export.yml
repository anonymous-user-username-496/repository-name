name: Export Isabelle to Haskell

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  export-haskell:
    runs-on: ubuntu-latest
    container:
      image: makarius/isabelle:Isabelle2026
      options: --user root
    steps:
      - name: Install Git
        run: |
          apt-get update && apt-get install -y git

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone AFP (Archive of Formal Proofs)
        run: |
          # Shallow clone to save bandwidth and prevent timeouts
          git clone --depth 1 https://github.com/isabelle-prover/mirror-afp-2026.git afp

      - name: Add Isabelle to PATH and Register AFP Component
        run: |
          echo "/home/isabelle/Isabelle/bin" >> $GITHUB_PATH
          # Register the AFP theories folder as a user component
          /home/isabelle/Isabelle/bin/isabelle components -u "$PWD/afp/thys"

      - name: Fix Permissions and Git Safe Directory
        run: |
          git config --global --add safe.directory '*'
          chmod -R 777 .

      - name: Export Haskell Files
        run: |
          # Update './Isabelle' to match the exact folder path where your ROOT file lives
          isabelle export -d ./Isabelle/bin/isabelle -O ./haskell-output -x "**/*.hs" Argument_Audit

      - name: Archive Haskell Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated-haskell-code
          path: ./haskell-output/
          
