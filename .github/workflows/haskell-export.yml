name: Export Isabelle to Haskell

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  export-haskell:
    runs-on: ubuntu-latest
    container:
      image: makarius/isabelle:Isabelle2026
      options: --user root
    steps:
      - name: Install Git
        run: |
          apt-get update && apt-get install -y git

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix Permissions and Git Safe Directory
        run: |
          git config --global --add safe.directory '*'
          chmod -R 777 .

      - name: Export Haskell Files
        run: |
          # Replace 'MySession' with your actual session name
          isabelle export -d . -O ./haskell-output -x "**/*.hs" Argument_Audit

      - name: Archive Haskell Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated-haskell-code
          path: ./haskell-output/
          
