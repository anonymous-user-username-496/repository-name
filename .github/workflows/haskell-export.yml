name: Build and Export Isabelle

on:
  push:
    branches: [ main, master ]

jobs:
  export:
    runs-on: ubuntu-latest
    # This official container solves "isabelle: not found" instantly 
    # because Isabelle is built directly into it:
    container: makarius/isabelle:Isabelle2024 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and export only the latest MySession
        run: |
          # 1. Build only your specific session to ensure it uses the latest code
          isabelle build -v -e -d . MySession

          # 2. Export only the Haskell files from that latest build
          isabelle export -d . -O ./haskell-output -x "**/*.hs" MySession

      - name: Save generated files as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: haskell-output
          path: haskell-output/
