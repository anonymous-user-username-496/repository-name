name: Export Isabelle to Haskell

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  export-haskell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and Setup Isabelle
        run: |
          echo "Downloading Isabelle..."
          wget -q https://isabelle.in.tum.de/dist/Isabelle2026_linux.tar.gz
          
          echo "Extracting Isabelle..."
          tar -xzf Isabelle2026_linux.tar.gz
          
          # Rename folder for easier path management and add to PATH
          mv Isabelle* isabelle-app
          echo "$PWD/isabelle-app/bin" >> $GITHUB_PATH

      - name: Export Haskell Files
        run: |
          # Replace 'MySession' with your actual session name from your ROOT file
          isabelle export -d . -O ./haskell-output -x "**/*.hs" MySession

      - name: Archive Haskell Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated-haskell-code
          path: ./haskell-output/
          
