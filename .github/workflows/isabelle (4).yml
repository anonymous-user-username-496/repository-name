# Adapted from an existing Isabelle CI workflow pattern:
# https://github.com/anguuananguuan-droid/set-coded-computation-zf/blob/main/.github/workflows/isabelle.yml
name: Isabelle

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isabelle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      ISABELLE_VERSION: '2025-2'
      AFP_DATE: '2026-02-06'
      ISABELLE_HOME_USER: ${{ github.workspace }}/.isabelle-user
    steps:
      - uses: actions/checkout@v4

      - name: Cache Isabelle and compiled heaps
        uses: actions/cache@v4
        with:
          path: |
            .ci-deps
            .isabelle-user
          key: isabelle-${{ runner.os }}-2025-2-afp-${{ env.AFP_DATE }}-${{ hashFiles('Isabelle/bin/isabelle/**') }}
          restore-keys: |
            isabelle-${{ runner.os }}-2025-2-afp-${{ env.AFP_DATE }}-
            isabelle-${{ runner.os }}-2025-2-

      - name: Install Isabelle distribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-deps
          if [ ! -x ".ci-deps/Isabelle${ISABELLE_VERSION}/bin/isabelle" ]; then
            curl -fL --retry 3 --connect-timeout 30 \
              "https://isabelle.in.tum.de/website-Isabelle${ISABELLE_VERSION}/dist/Isabelle${ISABELLE_VERSION}_linux.tar.gz" \
              -o .ci-deps/isabelle.tar.gz
            tar -xzf .ci-deps/isabelle.tar.gz -C .ci-deps
            rm .ci-deps/isabelle.tar.gz
          fi

      - name: Download only the required AFP entry
        shell: bash
        run: |
          set -euo pipefail
          cd .ci-deps
          if [ ! -d CondNormReasHOL ]; then
            curl -fL --retry 3 --connect-timeout 30 \
              "https://isa-afp.org/release/afp-CondNormReasHOL-${AFP_DATE}.tar.gz" \
              -o condnormreas-hol.tar.gz
            mkdir -p afp-extract
            tar -xzf condnormreas-hol.tar.gz -C afp-extract
            root_file="$(find afp-extract -type f -name ROOT -print -quit)"
            test -n "$root_file"
            mv "$(dirname "$root_file")" CondNormReasHOL
            rm -rf afp-extract condnormreas-hol.tar.gz
          fi

      - name: Check ROOT and theory names
        shell: bash
        run: |
          set -euo pipefail
          test -f Isabelle/bin/isabelle/ROOT
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          root = Path('Isabelle/bin/isabelle/ROOT').read_text()
          for filename in ('Scientific_Method_Audit.thy', 'Morality_Argument_Audit.thy'):
              p = Path('Isabelle/bin/isabelle') / filename
              if not p.exists():
                  print(f'Missing theory file: {p}', file=sys.stderr)
                  sys.exit(1)
              m = re.search(r'^\s*theory\s+(\S+)', p.read_text(encoding='utf-8-sig'), re.M)
              if not m:
                  print(f'No theory declaration in {p}', file=sys.stderr)
                  sys.exit(1)
              if m.group(1) != p.stem:
                  print(f'{p.name}: theory declares {m.group(1)!r}, but filename requires {p.stem!r}', file=sys.stderr)
                  sys.exit(1)
          print('Theory filenames and declarations match.')
          PY

      - name: Require a prebuilt HOL-Analysis heap
        shell: bash
        run: |
          set -euo pipefail
          ISABELLE="$GITHUB_WORKSPACE/.ci-deps/Isabelle${ISABELLE_VERSION}/bin/isabelle"

          # Refuse to proceed if the compiled HOL-Analysis heap is absent.
          # This prevents the session build from silently compiling it from source.
          HEAPS="$("$ISABELLE" getenv -b ISABELLE_HEAPS)"
          found=false
          IFS=':' read -r -a heap_dirs <<< "$HEAPS"
          for heap_dir in "${heap_dirs[@]}"; do
            [ -d "$heap_dir" ] || continue
            if find "$heap_dir" -maxdepth 1 -type f \
                \( -name 'HOL-Analysis' -o -name 'HOL-Analysis.db' \) \
                -print -quit | grep -q .; then
              found=true
              break
            fi
          done

          if [ "$found" != true ]; then
            echo "::error::No prebuilt HOL-Analysis heap found. Refusing to build HOL-Analysis from source."
            echo "Use a compatible Isabelle distribution/cache that already contains the HOL-Analysis heap."
            exit 1
          fi
          echo "Found prebuilt HOL-Analysis heap; proceeding."

      - name: Build only the requested session using available heaps
        shell: bash
        run: |
          set -euo pipefail
          ISABELLE="$GITHUB_WORKSPACE/.ci-deps/Isabelle${ISABELLE_VERSION}/bin/isabelle"
          "$ISABELLE" build -v -j 2 -o threads=2 \
            -d "$GITHUB_WORKSPACE/.ci-deps/CondNormReasHOL" \
            -d "$GITHUB_WORKSPACE/Isabelle/bin/isabelle" \
            Argument_Audit 2>&1 | tee "$RUNNER_TEMP/isabelle-build.log"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isabelle-build-log
          path: ${{ runner.temp }}/isabelle-build.log
          if-no-files-found: ignore
