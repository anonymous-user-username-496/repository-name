name: Check Isabelle Theories

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# Grants full permissions to the workflow execution environment
permissions:
  contents: write
  actions: write
  checks: write
  deployments: write
  issues: write
  packages: write
  pull-requests: write
  repository-projects: write
  security-events: write
  statuses: write

jobs:
  check-theories:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and extract AFP
        run: |
          wget -q https://www.isa-afp.org/release/afp-current.tar.gz
          tar -xzf afp-current.tar.gz

      - name: Generate Isabelle ROOT configuration
        run: |
          echo "session MySession = HOL +" > ROOT
          echo "  theories" >> ROOT
          for f in *.thy; do
            if [ -f "$f" ]; then
              theory_name="${f%.thy}"
              echo "    $theory_name" >> ROOT
            fi
          done

      - name: Build and verify Isabelle session
        run: |
          docker run --rm -v $(pwd):/home/isabelle/workspace -w /home/isabelle/workspace makarius/isabelle:Isabelle2025-2 build -d afp-current/thys -d . -b MySession
