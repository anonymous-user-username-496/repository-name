name: Isabelle Build

on:
push:
pull_request:
workflow_dispatch:

jobs:
build:
name: Build Isabelle session
runs-on: ubuntu-latest
steps:
- name: Check out repository
uses: actions/checkout@v4

```
  - name: Build session
    shell: bash
    run: |
      set -euo pipefail

      docker pull makarius/isabelle:latest

      docker run --rm \
        -v "$GITHUB_WORKSPACE:/workspace" \
        -w /workspace \
        makarius/isabelle:latest \
        bash -lc 'isabelle build -D /workspace/Isabelle/bin/isabelle Argument_Audit'
```
