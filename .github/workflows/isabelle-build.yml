
name: Isabelle Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Isabelle session
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            --entrypoint /bin/bash \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            makarius/isabelle@sha256:9bd33b183c399327c5d554fc8cde27c29b5d2b20cdc6fe7a604caa3f951018fc \
            -lc '
              set -euo pipefail

              AFP_URL="https://isa-afp.org/release/afp-CondNormReasHOL-2026-02-06.tar.gz"
              AFP_SHA256="10c3aa794a3cafcfb08a784e11515933162a490b32fc0cdb0cf88f489accdb38"

              mkdir -p /tmp/afp

              curl --fail --silent --show-error --location \
                "$AFP_URL" \
                --output /tmp/afp-entry.tar.gz

              echo "$AFP_SHA256  /tmp/afp-entry.tar.gz" \
                | sha256sum --check --strict

              tar -xzf /tmp/afp-entry.tar.gz -C /tmp/afp

              test -f /tmp/afp/CondNormReasHOL/ROOT

              isabelle build \
              -v \
             -d /tmp/afp/CondNormReasHOL \
             -D /workspace/Isabelle/bin/isabelle \
             Argument_Audit
             ,
